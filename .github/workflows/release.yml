name: Release

# Builds the Windows installer and the macOS DMG/ZIP and attaches both to one GitHub
# release. Run it from the Actions tab, or push a tag like v1.1.0.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: app

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish always

  # Runs after Windows so both builds upload to the same release instead of racing
  # to create two.
  macos:
    needs: windows
    runs-on: macos-latest
    env:
      # True only when a Developer ID certificate secret exists (see README → Releasing).
      HAS_APPLE_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Build and publish (signed + notarized)
        if: env.HAS_APPLE_CERT == 'true'
        run: npx electron-builder --mac --publish always -c.mac.notarize=true
        # Only set here: an empty CSC_LINK makes electron-builder fail instead of skipping signing.
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build and publish (ad-hoc signed)
        if: env.HAS_APPLE_CERT != 'true'
        run: npx electron-builder --mac --publish always

  publish:
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          gh release edit "v${VERSION}" --draft=false --latest --repo "${{ github.repository }}"
