name: Release

# Builds the Windows installer and the macOS DMG/ZIP, then creates ONE GitHub release
# with every file attached. Run it from the Actions tab, or push a tag like v1.2.0.
#
# The builds deliberately don't publish themselves: electron-builder uploads files in
# parallel and ends up creating several half-empty draft releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            app/release/*.exe
            app/release/*.exe.blockmap
            app/release/latest.yml
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    env:
      # True only when a Developer ID certificate secret exists (see README → Releasing).
      HAS_APPLE_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Build (signed + notarized)
        if: env.HAS_APPLE_CERT == 'true'
        run: npx electron-builder --mac --publish never -c.mac.notarize=true
        # Only set here: an empty CSC_LINK makes electron-builder fail instead of skipping signing.
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build (ad-hoc signed)
        if: env.HAS_APPLE_CERT != 'true'
        run: npx electron-builder --mac --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            app/release/*.dmg
            app/release/*.dmg.blockmap
            app/release/*.zip
            app/release/*.zip.blockmap
            app/release/latest-mac.yml
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Create the release
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          TAG="v${VERSION}"
          REPO="${{ github.repository }}"
          ls -la files

          # Remove leftover drafts from earlier runs.
          for id in $(gh api --paginate "repos/${REPO}/releases" --jq '.[] | select(.draft) | .id'); do
            gh api -X DELETE "repos/${REPO}/releases/${id}"
          done

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" files/* --clobber --repo "$REPO"
            gh release edit "$TAG" --latest --repo "$REPO"
          else
            gh release create "$TAG" files/* --repo "$REPO" --target "${{ github.sha }}" \
              --title "$VERSION" --latest \
              --notes "Aurum Cleaner ${VERSION} for Windows and macOS. Mac: download the .dmg, open it, and drag Aurum Cleaner to Applications (see INSTALL-MAC.md in the repo if macOS shows a one-time prompt)."
          fi
